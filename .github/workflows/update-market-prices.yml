name: Update Market Prices

on:
  schedule:
    # Run daily at 06:00 UTC (approximately midnight PST/PDT)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      force_refresh:
        description: 'Force refresh even if no changes detected'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No external dependencies needed - using stdlib only
      
      - name: Run price collector
        id: collect
        run: |
          echo "Starting price collection..."
          python scripts/collect_prices.py
          
          # Capture output for summary
          echo "COLLECTION_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          python scripts/collect_prices.py 2>&1 | tee /tmp/collect_output.txt
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Check if ram-prices.json changed
          if git diff --quiet ram-prices.json 2>/dev/null; then
            echo "CHANGES_DETECTED=false" >> $GITHUB_OUTPUT
            echo "No changes to ram-prices.json"
          else
            echo "CHANGES_DETECTED=true" >> $GITHUB_OUTPUT
            echo "Changes detected in ram-prices.json"
          fi
      
      - name: Configure Git
        run: |
          git config --global user.name 'SpecWise Market Bot'
          git config --global user.email 'specwise-market@github-actions.local'
      
      - name: Commit and push changes
        if: steps.collect.outputs.CHANGES_DETECTED == 'true' || github.event.inputs.force_refresh == 'true'
        run: |
          git add market-products.json ram-prices.json
          git commit -m "[Market] Auto-update prices $(date -u '+%Y-%m-%d %H:%M UTC')" \
            || echo "No changes to commit"
          git push
          
          echo "✅ Prices updated and pushed successfully"
      
      - name: Summary
        run: |
          echo "## Market Price Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files" >> $GITHUB_STEP_SUMMARY
          echo "- \`market-products.json\`: Product candidate database" >> $GITHUB_STEP_SUMMARY
          echo "- \`ram-prices.json\`: Frontend price data" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Change Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.collect.outputs.CHANGES_DETECTED }}" == "true" ]; then
            echo "✅ Changes detected and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No significant changes detected" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Collection Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/collect_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
